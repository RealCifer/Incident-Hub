version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ims_backend
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ims
      - MONGODB_URI=mongodb://mongodb:27017/ims
      - REDIS_URI=redis://redis:6379/0
    volumes:
      - ./backend/app:/code/app
    depends_on:
      - postgres
      - mongodb
      - redis

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ims_worker
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/ims
      - REDIS_URI=redis://redis:6379/0
    volumes:
      - ./backend/app:/code/app
    depends_on:
      - mongodb
      - redis
    command: python -m app.workers.signal_processor

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ims_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

  postgres:
    image: postgres:15-alpine
    container_name: ims_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ims
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:6
    container_name: ims_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: ims_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  mongodb_data:
